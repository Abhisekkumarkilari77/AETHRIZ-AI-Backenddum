<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AETHRIZ AI</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <header>
    <h1>⚡ AETHRIZ AI</h1>
    <p>Health Analysis &amp; Food Scanner</p>
  </header>

  <div class="tabs main-tabs">
    <button class="tab active" onclick="showMain('food', this)">🍱 Food Scanner</button>
    <button class="tab" onclick="showMain('health', this)">❤️ Health Analysis</button>
    <button class="tab" onclick="showMain('history', this)">📋 History</button>
  </div>

  <!-- FOOD SCANNER -->
  <div id="food-panel" class="panel">
    <div class="card">
      <h2>Food &amp; Product Scanner</h2>
      <div class="upload-area" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div id="preview-wrap">
          <p>📷 Click or drag &amp; drop an image</p>
          <p class="hint">Supports: food plates, packaged products, nutrition labels</p>
        </div>
        <img id="preview-img" style="display:none"/>
      </div>
      <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onFileSelect(event)"/>
      <div class="row">
        <input id="food-diet" type="text" placeholder="Dietary preferences (optional)"/>
        <input id="food-goals" type="text" placeholder="Goals e.g. lose weight (optional)"/>
      </div>
      <button class="btn-primary" onclick="scanFood()" id="scan-btn">Scan Image</button>
      <p id="food-msg" class="msg"></p>
    </div>
    <div id="food-result"></div>
  </div>

  <!-- HEALTH ANALYSIS -->
  <div id="health-panel" class="panel" style="display:none">
    <div class="card">
      <h2>Health &amp; Lifestyle Analysis</h2>
      <div class="form-grid">
        <label>Age<input id="h-age" type="number" min="1" max="120" placeholder="22"/></label>
        <label>Sex
          <select id="h-sex">
            <option value="">Select</option>
            <option>male</option><option>female</option><option>other</option><option>prefer_not_to_say</option>
          </select>
        </label>
        <label>Height (cm)<input id="h-height" type="number" placeholder="170"/></label>
        <label>Weight (kg)<input id="h-weight" type="number" placeholder="70"/></label>
        <label>Sleep (hours)<input id="h-sleep" type="number" step="0.5" placeholder="7"/></label>
        <label>Water intake (L)<input id="h-water" type="number" step="0.1" placeholder="2"/></label>
        <label>Activity level
          <select id="h-activity">
            <option value="">Select</option>
            <option>sedentary</option><option>light</option><option>moderate</option><option>active</option><option>very_active</option>
          </select>
        </label>
        <label>Sleep quality
          <select id="h-sleep-q">
            <option value="">Select</option>
            <option>poor</option><option>fair</option><option>good</option><option>excellent</option>
          </select>
        </label>
        <label>Stress (1-10)<input id="h-stress" type="number" min="1" max="10" placeholder="5"/></label>
        <label>Energy (1-10)<input id="h-energy" type="number" min="1" max="10" placeholder="6"/></label>
        <label>Diet preference<input id="h-diet" type="text" placeholder="vegetarian, vegan..."/></label>
        <label>Goals<input id="h-goals" type="text" placeholder="lose weight, better sleep..."/></label>
      </div>
      <label style="display:block;margin-top:12px">Medical conditions / allergies
        <input id="h-conditions" type="text" placeholder="diabetes, hypertension... (comma separated)"/>
      </label>
      <label style="display:block;margin-top:8px">Additional notes
        <textarea id="h-notes" rows="3" placeholder="Any other relevant information..."></textarea>
      </label>
      <button class="btn-primary" onclick="analyseHealth()" id="health-btn">Analyse Health</button>
      <p id="health-msg" class="msg"></p>
    </div>
    <div id="health-result"></div>
  </div>

  <!-- HISTORY -->
  <div id="history-panel" class="panel" style="display:none">
    <div class="card">
      <h2>History</h2>
      <div class="tabs">
        <button class="tab active" onclick="loadHistory('food', this)">Food Scans</button>
        <button class="tab" onclick="loadHistory('health', this)">Health Analyses</button>
      </div>
      <div id="history-list"><p class="hint">Select a tab to load history.</p></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
